paths:
  /api/users/{uid}/documents:
    post:
      summary: Cargar documento de usuario
      description: >
        El usuario puede cargar documentos en su propio perfil.
        Un administrador puede cargar documentos para cualquier usuario.

      tags:
        - Uploads

      security:
        - BearerAuth: []

      parameters:
        - name: uid
          in: path
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - document
                - documentType

              properties:
                documentType:
                  type: string

                  enum:
                    - dni
                    - licencia_conducir
                    - comprobante_domicilio
                    - otro

                  example: dni

                document:
                  type: string
                  format: binary

      responses:
        "201":
          description: Documento cargado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: Archivo o tipo de documento inválido

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El usuario no puede modificar este perfil

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Usuario no encontrado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}/receipt:
    post:
      summary: Cargar comprobante de un pedido
      description: >
        Disponible para administradores y customers.
        Un customer solo puede cargar comprobantes en sus propios pedidos.

      tags:
        - Uploads

      security:
        - BearerAuth: []

      parameters:
        - name: oid
          in: path
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - receipt

              properties:
                receipt:
                  type: string
                  format: binary

      responses:
        "201":
          description: Comprobante cargado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        "400":
          description: Archivo inválido

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El usuario no tiene acceso al pedido

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Pedido no encontrado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{did}/receipt:
    post:
      summary: Cargar comprobante de una entrega
      description: >
        Disponible para administradores y drivers.
        Un driver solo puede cargar comprobantes en entregas
        que estén asignadas a él.

      tags:
        - Uploads

      security:
        - BearerAuth: []

      parameters:
        - name: did
          in: path
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - receipt

              properties:
                receipt:
                  type: string
                  format: binary

      responses:
        "201":
          description: Comprobante cargado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'

        "400":
          description: Archivo inválido

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El driver no tiene acceso a esta entrega

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Entrega no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'