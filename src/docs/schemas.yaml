components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error

        error:
          type: string
          example: USER_NOT_FOUND

        message:
          type: string
          example: Usuario no encontrado

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success

        message:
          type: string
          example: Operación realizada correctamente

    DocumentMeta:
      type: object
      properties:
        documentType:
          type: string
          enum:
            - dni
            - licencia_conducir
            - comprobante_domicilio
            - otro
          example: dni

        originalName:
          type: string
          example: dni.pdf

        generatedName:
          type: string
          example: "1725390000000-123456789.pdf"

        path:
          type: string
          example: uploads/users/documents/1725390000000-123456789.pdf

        mimetype:
          type: string
          example: application/pdf

        size:
          type: integer
          example: 204800

        uploadedAt:
          type: string
          format: date-time

    ReceiptMeta:
      type: object
      nullable: true

      properties:
        originalName:
          type: string
          example: comprobante.jpg

        generatedName:
          type: string
          example: "1725390000000-987654321.jpg"

        path:
          type: string
          example: uploads/orders/receipts/1725390000000-987654321.jpg

        mimetype:
          type: string
          example: image/jpeg

        size:
          type: integer
          example: 102400

        uploadedAt:
          type: string
          format: date-time

    User:
      type: object

      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abcd

        firstName:
          type: string
          example: Ana

        lastName:
          type: string
          example: Perez

        email:
          type: string
          format: email
          example: ana@mail.com

        role:
          type: string
          enum:
            - admin
            - customer
            - driver
            - store
          example: customer

        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMeta'

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object

      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 10

        total:
          type: integer
          example: 25

        totalPages:
          type: integer
          example: 3

    OrderItem:
      type: object

      properties:
        name:
          type: string
          example: Auriculares Bluetooth

        quantity:
          type: integer
          example: 2

        price:
          type: number
          example: 1500

    Order:
      type: object

      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b005678efgh

        customer:
          type: string
          example: 665f4d0a8f9a1b001234abcd

        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

        deliveryAddress:
          type: string
          example: Av. Siempre Viva 742

        total:
          type: number
          example: 3000

        status:
          type: string
          enum:
            - created
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: created

        priority:
          type: string
          enum:
            - low
            - normal
            - high
          example: normal

        delivery:
          type: string
          nullable: true

        receipt:
          $ref: '#/components/schemas/ReceiptMeta'

    Delivery:
      type: object

      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b009876ijkl

        order:
          type: string
          example: 665f4d0a8f9a1b005678efgh

        driver:
          type: string
          nullable: true
          example: 665f4d0a8f9a1b001234mnop

        status:
          type: string
          enum:
            - pending
            - assigned
            - in_transit
            - delivered
          example: assigned

        priority:
          type: string
          enum:
            - low
            - normal
            - high
          example: normal

        assignedAt:
          type: string
          format: date-time
          nullable: true

        deliveredAt:
          type: string
          format: date-time
          nullable: true

        receipt:
          $ref: '#/components/schemas/ReceiptMeta'