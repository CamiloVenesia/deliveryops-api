paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener pedidos
      description: Los administradores pueden consultar todos los pedidos. Los customers solo reciben sus propios pedidos.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: El rol autenticado no tiene acceso a pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Orders
      summary: Crear un nuevo pedido
      description: >
        Disponible para admin y customer. Un customer crea pedidos únicamente
        para sí mismo. Un admin debe indicar el campo customer. El pedido se
        crea con estado created y registra la primera entrada de statusHistory.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - deliveryAddress
              properties:
                customer:
                  type: string
                  description: ID del cliente. Obligatorio para admin; un customer no necesita enviarlo.
                  example: 665f4d0a8f9a1b001234abcd
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderItem'
                deliveryAddress:
                  type: string
                  example: Av. Siempre Viva 742
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                  example: normal
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  shippingCost:
                    type: number
                    example: 20
                  message:
                    type: string
                    example: Pedido creado y email enviado
        "400":
          description: Datos obligatorios faltantes o inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Acción no permitida para el usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: El cliente indicado no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}:
    get:
      tags:
        - Orders
      summary: Obtener un pedido por ID
      description: Los administradores pueden consultar cualquier pedido. Un customer solo puede consultar sus propios pedidos.
      security:
        - BearerAuth: []
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      responses:
        "200":
          description: Pedido obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: El usuario no tiene acceso a este pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Orders
      summary: Eliminar un pedido
      description: Solo disponible para administradores.
      security:
        - BearerAuth: []
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      responses:
        "200":
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pedido eliminado
        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Solo los administradores pueden eliminar pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}/status:
    patch:
      tags:
        - Orders
      summary: Actualizar el estado de un pedido
      description: |
        Solo disponible para administradores.

        La API valida una máquina de estados y rechaza saltos inválidos.

        Transiciones válidas:
        - created → assigned | cancelled
        - assigned → picked_up | in_transit | cancelled
        - picked_up → in_transit | cancelled
        - in_transit → delivered | cancelled
        - delivered y cancelled son estados terminales

        Cada cambio agrega una entrada a statusHistory con estado anterior,
        estado nuevo, actor, rol, origen y fecha.

        Si existe una entrega asociada, los estados assigned, in_transit,
        delivered y cancelled se sincronizan con la entrega cuando la
        transición equivalente también es válida.
      security:
        - BearerAuth: []
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - created
                    - assigned
                    - picked_up
                    - in_transit
                    - delivered
                    - cancelled
                  example: in_transit
      responses:
        "200":
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          description: Estado faltante, inválido o transición no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTransition:
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: "Transición inválida de pedido: created → in_transit"
        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Solo los administradores pueden modificar el estado de un pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido o entrega asociada no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: El pedido ya fue entregado y no puede modificarse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'