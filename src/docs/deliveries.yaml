paths:
  /api/deliveries:
    get:
      summary: Obtener entregas
      description: >
        Los administradores pueden consultar todas las entregas.
        Los drivers solo reciben las entregas asignadas a ellos.
        Los customers solo reciben entregas correspondientes a sus pedidos.

      tags:
        - Deliveries

      security:
        - BearerAuth: []

      responses:
        "200":
          description: Lista paginada de entregas

          content:
            application/json:
              schema:
                type: object

                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'

                  page:
                    type: integer
                    example: 1

                  limit:
                    type: integer
                    example: 10

                  total:
                    type: integer
                    example: 5

                  totalPages:
                    type: integer
                    example: 1

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El rol autenticado no tiene acceso

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear una entrega
      description: Solo disponible para administradores.

      tags:
        - Deliveries

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - order
                - driver

              properties:
                order:
                  type: string
                  example: 665f4d0a8f9a1b005678efgh

                driver:
                  type: string
                  example: 665f4d0a8f9a1b001234mnop

                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                  default: normal
                  example: normal

      responses:
        "201":
          description: Entrega creada correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'

        "400":
          description: Datos inválidos o incompletos

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: Solo los administradores pueden crear entregas

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Pedido o repartidor no encontrado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{did}:
    get:
      summary: Obtener una entrega por ID
      description: >
        Los administradores pueden consultar cualquier entrega.
        El driver solo puede consultar entregas asignadas a él.
        El customer solo puede consultar entregas de sus propios pedidos.

      tags:
        - Deliveries

      security:
        - BearerAuth: []

      parameters:
        - name: did
          in: path
          required: true
          description: ID de la entrega

          schema:
            type: string

      responses:
        "200":
          description: Entrega obtenida correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El usuario no tiene acceso a esta entrega

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Entrega no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar una entrega
      description: Solo disponible para administradores.

      tags:
        - Deliveries

      security:
        - BearerAuth: []

      parameters:
        - name: did
          in: path
          required: true
          description: ID de la entrega

          schema:
            type: string

      responses:
        "200":
          description: Entrega eliminada correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: Solo los administradores pueden eliminar entregas

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Entrega no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{did}/status:
    patch:
      summary: Actualizar estado de una entrega
      description: >
        Disponible para administradores y para el driver
        asignado a la entrega.

      tags:
        - Deliveries

      security:
        - BearerAuth: []

      parameters:
        - name: did
          in: path
          required: true
          description: ID de la entrega

          schema:
            type: string

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - status

              properties:
                status:
                  type: string

                  enum:
                    - pending
                    - assigned
                    - in_transit
                    - delivered

                  example: in_transit

      responses:
        "200":
          description: Estado actualizado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'

        "400":
          description: Estado inválido o faltante

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "401":
          description: Autenticación requerida

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El usuario no puede actualizar esta entrega

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Entrega no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "409":
          description: La entrega ya fue completada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'