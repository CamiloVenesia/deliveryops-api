paths:
  /api/users:
    get:
      summary: Obtener usuarios
      description: Obtiene una lista paginada de usuarios. Las contraseñas nunca se incluyen en las respuestas.
      tags:
        - Users

      parameters:
        - name: page
          in: query
          required: false
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Cantidad máxima de usuarios por página. El límite máximo permitido es 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10

      responses:
        "200":
          description: Lista paginada de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo usuario
      description: Crea un usuario y almacena su contraseña mediante hash seguro con bcrypt. La contraseña nunca se devuelve en la respuesta.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - firstName
                - lastName
                - email
                - password

              properties:
                firstName:
                  type: string
                  example: Ruti

                lastName:
                  type: string
                  example: Esposito

                email:
                  type: string
                  format: email
                  example: ruti@mail.com

                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: "PasswordSeguro123"

                role:
                  type: string
                  enum:
                    - customer
                    - driver
                    - store
                  default: customer
                  example: customer

      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: Faltan datos obligatorios o el usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: No se permite crear usuarios con rol admin mediante este endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      description: Devuelve los datos públicos del usuario. La contraseña nunca se incluye.
      tags:
        - Users

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string

      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un usuario por ID
      tags:
        - Users

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string

      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'