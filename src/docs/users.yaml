paths:
  /api/users:
    get:
      summary: Obtener todos los usuarios
      description: Solo disponible para administradores.
      tags:
        - Users

      security:
        - BearerAuth: []

      responses:
        "200":
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: Solo los administradores pueden listar usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo usuario
      description: Endpoint público de registro. No permite crear usuarios con rol admin.
      tags:
        - Users

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - firstName
                - lastName
                - email
                - password

              properties:
                firstName:
                  type: string
                  example: Ana

                lastName:
                  type: string
                  example: Perez

                email:
                  type: string
                  format: email
                  example: ana@mail.com

                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: PasswordSeguro123

                role:
                  type: string
                  enum:
                    - admin
                    - customer
                    - driver
                    - store
                  default: customer
                  example: customer

      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: Faltan datos obligatorios o el usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: No se permite crear usuarios con rol admin mediante este endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      description: Un usuario puede consultar su propio perfil. Un administrador puede consultar cualquier usuario.
      tags:
        - Users

      security:
        - BearerAuth: []

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string

      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: El usuario no tiene permiso para consultar este perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un usuario por ID
      description: Solo disponible para administradores.
      tags:
        - Users

      security:
        - BearerAuth: []

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string

      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

        "401":
          description: Autenticación requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "403":
          description: Solo los administradores pueden eliminar usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'